# POB 未实现的技能效果配置
# 
# 用途：POB 的 SkillStatMap.lua 未映射某些技能的 stats，
#       导致这些效果无法在 DPS 计算中体现。本配置提供手动注入方案。
#
# 集成点：
# - 光环类技能：在 aura_spirit_analysis 中自动注入
# - 主动技能：在报告格式化时添加预估效果标注
#
# 扫描结果（2026-03-30）：
# - SkillStatMap 已映射: 880 个 stats
# - 未映射: 449 个 stats
# - 玩家受益相关: 226 个
#   - 主动技能: 4 个
#   - 辅助宝石: 115 个
#   - 触发类: 17 个
#   - 其他: 90 个
#
# 更新方式：
# 1. 运行 python -B _scan_all.py 查看完整扫描结果
# 2. 从输出中筛选影响玩家数值的 stats
# 3. 按下面的格式添加到 skills 部分

skills:
  # ===================================================================
  # 主动技能（skill_type: active）
  # ===================================================================
  
  "Unbound Avatar":
    detect:
      type: "gem_name"
      name: "Unbound Avatar"
    ascendancy_node:
      pattern: "Rage"
    condition: "Condition:Unbound"
    skill_type: "active"
    effects:
      - type: "mod"
        mod_name: "ElementalDamage"
        mod_type: "MORE"
        value: 40
        source: "UA_Unbound"
        description: "40% MORE 元素伤害（Unbound 状态）"

  "Pinnacle of Power":
    detect:
      type: "skill_id"
      skill_id: "PinnacleOfPowerPlayer"
    skill_type: "active"
    condition: "满 Power Charge 时使用，消耗所有 Power Charge，获得 buff"
    effects:
      # 每颗 Power Charge +15% MORE 元素伤害（constantStats: elemental_power_elemental_damage_+%_final_per_power_charge = 15）
      # 品质加成：每点 +0.1% MORE（qualityStats: elemental_power_elemental_damage_+%_final_per_power_charge = 0.1）
      # value 运行时动态计算 = PowerChargesMax × (15 + quality × 0.1)
      # 本构筑 PowerChargesMax=8, quality=20 → 8 × (15 + 2) = 136% MORE
      - type: "mod"
        mod_name: "ElementalDamage"
        mod_type: "MORE"
        value: null  # 动态计算
        source: "PoP_sim"
        description: "每颗 Power Charge +15% MORE 元素伤害（满层）"
    dynamic_value:
      type: "charge_based"
      # 从构筑 output.PowerChargesMax 读取 Power Charge 数量
      charge_stat: "PowerChargesMax"
      # 从 constantStats 读取每颗 charge 的 MORE 百分比
      per_charge_value: 15
      # 品质加成 per charge（来自 qualityStats）
      quality_per_charge: 0.1
      # 公式: PowerChargesMax × (per_charge_value + quality × quality_per_charge)

  "Demon Form":
    detect:
      type: "gem_name"
      name: "Demon Form"
    skill_type: "active"
    effects:
      - type: "mod"
        mod_name: "SpellDamage"
        mod_type: "MORE"
        value: null  # 动态读取层数
        source: "DemonForm_stacks"
        description: "每层 +MORE 法术伤害（需动态读取层数）"
    # 特殊处理：需要动态计算层数
    dynamic_value:
      type: "stack_based"
      stat_pattern: "demon_form_spell_damage_+%_final_per_stack"

  "Charged Blast":
    detect:
      type: "gem_name"
      name: "Charged Blast"
    skill_type: "active"
    effects:
      - type: "mod"
        mod_name: "SpellDamage"
