  # ===================================================================
  # 主动技能（非精魄辅助，非已装备光环）
  # 仅在 _test_add_candidate_aura 候选光环测试时通过 Sim 注入
  # POB 原生不计算这些条件性效果
  # ===================================================================

  "Attrition":
    detect:
      type: "skill_id"
      skill_id: "AttritionPlayer"
    skill_type: "active"
    condition: "对稀有/独特敌人，每秒 +1% MORE，最高叠加（等级20=59秒=59% MORE）"
    effects:
      # 简化模拟：假设战斗已持续足够久，取满层效果
      # constantStats: skill_attrition_hit_damage_+%_final_vs_rare_or_unique_enemy_per_second_ever_in_presence_up_to_max = 1
      # stats[20]: skill_attrition_presence_max_seconds = 59 → 59% MORE vs Rare/Unique
      - type: "mod"
        mod_name: "Damage"
        mod_type: "MORE"
        value: 59
        source: "Attrition_sim"
        mod_flag: "Hit"
        description: "对稀有/独特敌人 +59% MORE 伤害（满层，等级20）"

  "Berserk":
    detect:
      type: "skill_id"
      skill_id: "BerserkPlayer"
    skill_type: "active"
    condition: "增强 Rage 效果，需要构筑有 MaximumRage，代价每分钟每点 Rage 失去 6% 生命"
    # Berserk 添加后 POB 自动处理：
    #   - CanGainRage flag（CalcPerform.lua:662 入口条件）
    #   - MaximumRage（从 Berserk 技能数据读取）
    #   - RageEffect INC（从 Berserk buff 读取，perform 中应用）
    #
    # RageEffect 计算：
    #   RageEffect = floor(RageStacks × (1 + INC/100))
    #   Berserk Lv20: 74% INC RageEffect（来自 statMap + statInterpolation）
    #   10 Rage: floor(10 × 1.74) = 17 → 17% MORE Attack Damage
    #   20 Rage: floor(20 × 1.74) = 34 → 34% MORE Attack Damage
    #
    # Sim 配置：设置 multiplierRage（POB ConfigOptions 中 ifFlag=CanGainRage）
    # 默认 10 Rage（保守估计，战斗中容易维持）
    # 实际增幅取决于构筑 MaximumRage 和战斗情况
    effects:
      - type: "config"
        var: "multiplierRage"
        value: 10
        source: "Berserk_sim"
        description: "设置 Rage 层数（ConfigOptions 中 ifFlag=CanGainRage）"
      # POB 修复后（CalcPerform.lua Override 返回 0 bug），Berserk 技能添加后：
      # - CanGainRage 自动设置 ✓
      # - MaximumRage 从 Berserk 技能数据读取 ✓
      # - RageEffect INC 从 Berserk buff 读取（perform 中应用）✓
    config_ranges:
      - var: "multiplierRage"
        label: "Rage 层数"
        min: 1
        mid: 10
        max: null  # 运行时从 output.MaximumRage 读取
        condition_label: "Rage 1~满层"
      # 只需设置 multiplierRage 配置来指定 Rage 层数

  "Archmage":
