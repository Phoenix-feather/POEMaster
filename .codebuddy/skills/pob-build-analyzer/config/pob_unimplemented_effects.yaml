      type: "skill_id"
      skill_id: "ArchmagePlayer"
    skill_type: "active"
    condition: "非引导法术消耗额外法力，造成额外闪电伤害（基于最大法力值）"
    # Archmage 只对 Non-Channelling Spell 有效，对 Attack 技能无效
    # 当前构筑 Flicker Strike 是 Attack，所以 Archmage 不会有效果
    # POB 原生计算 Archmage 效果（通过 statMap 映射），无需 Sim 注入
    # 但对 Attack 构筑，Archmage 添加后 POB 不会应用任何修正
    effects: []

