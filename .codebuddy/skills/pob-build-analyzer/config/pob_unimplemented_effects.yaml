  # ===================================================================
  # 光环/被动效果（skill_type: aura）
  # ===================================================================
  
  "Elemental Conflux":
    detect:
      type: "gem_name"
      name: "Elemental Conflux"
    skill_type: "active"
    condition: "每8秒随机选择火/冰/电，给该元素 MORE 伤害（时间加权平均≈1/3覆盖率）"
    # POB 未映射 skill_elemental_conflux_active_element_damage_+%_final stat
    # SkillStatMap.lua 中没有此 stat 的映射，POB 添加 EC 后不会生成伤害 mod
    # 等级20: +59% MORE 某元素伤害
    # 来源：act_int.lua:5387 stats[20]=59, qualityStats=0.5%/q
    #
    # 期望值计算（精确）：
    #   EC 每次随机选一个元素 +59% MORE，8秒一轮
    #   时间加权平均 = 59% × (各元素DPS占比之和) / 3
    #   近似等价于 59%/3 ≈ 19.7% MORE ElementalDamage
    #   但由于元素分布不均，实际值可能偏低（如 Cold=0% 时浪费了 1/3 轮转）
    #
    # Sim 用 20% MORE ElementalDamage 作为简化（≈59%×1/3向上取整）
    effects:
      - type: "mod"
        mod_name: "ElementalDamage"
        mod_type: "MORE"
        value: 20
        source: "EC_sim"
        mod_flag: "Hit"
        description: "元素伤害 MORE（期望 59%×1/3≈20%，等级20，简化模拟）"

